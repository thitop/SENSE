[package]
name = "aim-trainer"
version = "0.2.0"
edition = "2021"

[dependencies]
# Window & Event Loop
winit = "0.30"

# GPU Rendering
wgpu = "24.0"

# Math
glam = { version = "0.29", features = ["serde"] }

# UI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
egui_plot = "0.31"
egui-phosphor = "0.9"
# Draws the window icon from the Phosphor crosshair (already used by egui).
ab_glyph = "0.2"
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }

# Audio
rodio = "0.20"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Embeds the icon in the Windows .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
png = "0.17"
# Same naga as wgpu 24; validates the WGSL shaders in tests.
naga = { version = "24.0.0", features = ["wgsl-in"] }
