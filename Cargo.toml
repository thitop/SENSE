[package]
name = "aim-trainer"
version = "0.1.0"
edition = "2021"

[dependencies]
# Window & Event Loop
winit = "0.30"

# GPU Rendering
wgpu = "24.0"

# Math
glam = { version = "0.29", features = ["serde"] }

# Raw Input (Windows API)
windows = { version = "0.58", features = [
    "Win32_UI_Input",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
] }

# UI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
egui_plot = "0.31"

# Audio
rodio = "0.20"

# Data
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utils
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
